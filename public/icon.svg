<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="mathBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#a5b4fc" stroke-width="8" opacity="0.3"/>
  
  <!-- Math Grid Pattern Overlay -->
  <circle cx="100" cy="100" r="12" fill="#ffffff" opacity="0.2"/>
  <circle cx="412" cy="100" r="16" fill="#fbbf24" opacity="0.4"/>
  <circle cx="90" cy="412" r="14" fill="#a7f3d0" opacity="0.3"/>
  <circle cx="420" cy="412" r="10" fill="#ffffff" opacity="0.2"/>
  
  <!-- Center Main Badge "2 ×" -->
  <rect x="86" y="96" width="340" height="220" rx="48" fill="#ffffff" filter="url(#shadow)"/>
  
  <text x="256" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="130" font-weight="900" text-anchor="middle" fill="#4338ca">
    2 × 3
  </text>
  
  <!-- Equal Product Badge -->
  <g transform="translate(146, 330)">
    <rect x="0" y="0" width="220" height="96" rx="48" fill="url(#mathBadge)" filter="url(#shadow)"/>
    <text x="110" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="#1e1b4b">
      = 6 ★
    </text>
  </g>
</svg>